syntax = "proto3";

package helloworld;

option java_package = "com.example.testserver.proto";
option java_multiple_files = true;

service Greeter {
  // Unary
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Server-streaming
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
